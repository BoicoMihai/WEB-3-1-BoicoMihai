<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="API.css">
</head>
<body>

    <div class="card">
        <div class="search">
            <input type="text" id="input-box" placeholder="Enter city name" spellcheck="false">
            <button id="search-img-button">
                <img src="APIIMGS/image.png" alt="" class="search-image">
            </button>
        </div>

        <div class="weather">
            <img src="APIIMGS/clouds.png" alt="Weather-icon" class="weather-icon">
            <h1 class="temp">12°C</h1>
            <h2 class="city">Chisinau</h2>
            <div class="details">
                <div class="col">
                    <img src="APIIMGS/humidity.png" alt="Humidity icon">
                    <div>
                        <p class="Humidity">50%</p>
                        <p>Humidity</p>
                    </div>
                </div>
                
                    <div class="col">
                        <img src="APIIMGS/windS.png" alt="Wind icon">
                        <div>
                            <p class="Wind">15 Km/h</p>
                            <p>Wind Speed</p>
                        </div>
                    </div>  
                </div>
            </div>
        </div>
    </div>

    <script src="API.js"></script>
</body>
</html>
