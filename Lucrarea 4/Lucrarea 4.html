<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="input" placeholder="Introduceti un produs">
    <button id="btn-sfarsit">Adauga la sfarsit</button>
    <button id="btn-inceput">Adauga la inceput</button>
    <button id="btn-sterge-sfarsit">sterge de la sfarsit</button>
    <button id="btn-sterge-inceput">sterge de la inceput</button>

    <p id="lista"></p>

    <h1>CATALOG ELECTRONIC</h1>
    <p id="numar"></p>
    <div id="catalog"></div>

    <hr>
    <h2>Adauga elev</h2>
    Nume: <input type="text" id="nume"><br>
    Varsta: <input type="number" id="varsta"><br>
    Nota: <input type="number" id="nota"><br>
    <button id="btn-adauga">Adauga elev</button>

    <hr>
    <h2>Sterge elev</h2>
    Numele elevului: <input type="text" id="nume-sterge">
    <button id="btn-sterge">Sterge elev</button>
    <p id="mesaj-sterge"></p>

    <hr>
    <h2>Cauta elev</h2>
    Cauta elev: <input type="text" id="nume-cauta">
    <button id="btn-cauta">Cauta</button>
    <div id="rezultat-cautare"></div>

    <script src="script.js"></script>
</body>
</html>
